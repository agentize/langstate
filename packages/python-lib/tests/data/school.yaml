entities:
  Person:
    fields:
      - id: person.id
        info:
          display_name: "Person ID"
          description: "Primary key for a person"
        valid_value_types: [string]
        tags: ["id"]

      - id: person.name
        info:
          display_name: "Full Name"
          description: "Legal full name of the person"
        valid_value_types: [string]
        default_value: ""
        tags: ["pii", "name"]
        # A field may have dependencies on itself (validation-style) and others.
        dependencies:
          - property_id: person.name
            valueSimilarityCondition:
              reference: "John/Jane Doe"
              threshold: 0.6
          - property_id: person.name
            promptCondition:
              prompt: "Does this look like a human personal name?"

      - id: person.age
        info:
          display_name: "Age"
          description: "Age in years"
        valid_value_types: [integer, number]
        dependencies:
          - property_id: person.age
            valueRangeCondition:
              min: 0
              max: 120
              inclusive_min: true
              inclusive_max: true

      - id: person.email
        info:
          display_name: "Email"
          description: "Contact email"
        valid_value_types: [string]
        tags: ["pii", "email"]
        dependencies:
          - property_id: person.email
            promptCondition:
              prompt: "Is this a valid email address?"

  Student:
    fields:
      - id: student.id
        info:
          display_name: "Student ID"
          description: "Primary key for a student"
        valid_value_types: [string]
        tags: ["id"]

      - id: student.person_ref
        info:
          display_name: "Person Ref"
          description: "REFERENCE to person.id (value stores the referenced id string)"
        valid_value_types: [reference]
        default_value: ""
        dependencies:
          # Gating: can only set person_ref if the referenced person.id is valid/exists
          - property_id: person.id
            promptCondition:
              prompt: "Does this value correspond to an existing person.id?"

      - id: student.grade_level
        info:
          display_name: "Grade Level"
          description: "Student grade level (1..12)"
        valid_value_types: [integer]
        dependencies:
          # Dep 1 (self): must be one of 1..12
          - property_id: student.grade_level
            valueRangeCondition:
              min: 1
              max: 12
              inclusive_min: true
              inclusive_max: true
          # Dep 2 (cross-field): person.age should be compatible with K-12 range
          - property_id: person.age
            valueRangeCondition:
              min: 5
              max: 19
              inclusive_min: true
              inclusive_max: true

      - id: student.class_ref
        info:
          display_name: "Class Ref"
          description: "REFERENCE to class.id (value stores the referenced id string)"
        valid_value_types: [reference]
        default_value: ""
        dependencies:
          - property_id: class.id
            promptCondition:
              prompt: "Does this value correspond to an existing class.id?"

  Teacher:
    fields:
      - id: teacher.id
        info:
          display_name: "Teacher ID"
          description: "Primary key for a teacher"
        valid_value_types: [string]
        tags: ["id"]

      - id: teacher.person_ref
        info:
          display_name: "Person Ref"
          description: "REFERENCE to person.id (value stores the referenced id string)"
        valid_value_types: [reference]
        default_value: ""
        dependencies:
          - property_id: person.id
            promptCondition:
              prompt: "Does this value correspond to an existing person.id?"

      - id: teacher.department
        info:
          display_name: "Department"
          description: "Subject area"
        valid_value_types: [string]
        dependencies:
          - property_id: teacher.department
            enumerationCondition:
              values: ["Math", "Science", "English", "Arts", "History", "PE"]

  Class:
    fields:
      - id: class.id
        info:
          display_name: "Class ID"
          description: "Primary key for a class"
        valid_value_types: [string]
        tags: ["id"]

      - id: class.room
        info:
          display_name: "Room"
          description: "Room number or code"
        valid_value_types: [string]

      - id: class.capacity
        info:
          display_name: "Capacity"
          description: "Max number of students"
        valid_value_types: [integer]
        dependencies:
          - property_id: class.capacity
            valueRangeCondition:
              min: 1
              max: 60
              inclusive_min: true
              inclusive_max: true

      - id: class.student_refs
        info:
          display_name: "Student Refs"
          description: "ARRAY of REFERENCEs to student.id; stored value is the array length"
        valid_value_types: [array]
        default_value: 0
        dependencies:
          # You may implement the actual resolution in code; here we gate on existence.
          - property_id: student.id
            promptCondition:
              prompt: "Do all referenced student IDs correspond to existing student.id values?"

      - id: class.teacher_ref
        info:
          display_name: "Teacher Ref"
          description: "REFERENCE to teacher.id (value stores the referenced id string)"
        valid_value_types: [reference]
        default_value: ""
        dependencies:
          - property_id: teacher.id
            promptCondition:
              prompt: "Does this value correspond to an existing teacher.id?"