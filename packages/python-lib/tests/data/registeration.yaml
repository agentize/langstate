openapi: 3.1.0
info:
  title: Event Registration Schema
  version: 1.2.3

x-sup:
  version: 1
  root_entity: Registration
  types: ../langstate/data_structure/types.yaml#components/schemas

components:
  schemas:

    Invitation:
      type: object
      description: "Email content and optional scheduled send time."
      properties:
        subject:
          $ref: "${x-sup.types}/ShortString120"
        body:
          $ref: "${x-sup.types}/MarkdownString"
        send_at:
          $ref: "${x-sup.types}/DateTime"
      required: [subject, body]

    Pricing:
      type: object
      description: "Computed pricing (system-managed)."
      properties:
        currency:
          $ref: "${x-sup.types}/CurrencyCode"
        adult_price:
          $ref: "${x-sup.types}/UnitPrice"
        child_price:
          $ref: "${x-sup.types}/UnitPrice"
        senior_price:
          $ref: "${x-sup.types}/UnitPrice"
        coupon_code:
          $ref: "${x-sup.types}/CouponCode"
        total:
          $ref: "${x-sup.types}/MoneyTotal"
      required: [currency]
      x-sup:
        dependencies:
          - from: Registration.event
            to: Pricing.total
            dependency:
              prompt: { prompt: "Compute total only after an event is selected." }
          - from: Registrant.age_group
            to: Pricing.total
            dependency:
              enumeration: { values: ["child","adult","senior"] }

    Person:
      type: object
      description: "Base participant profile."
      properties:
        id:         { $ref: "${x-sup.types}/Id" }
        username:   { $ref: "${x-sup.types}/Username" }
        name:       { $ref: "${x-sup.types}/NameString" }
        email:      { $ref: "${x-sup.types}/Email" }
        age_group:  { $ref: "${x-sup.types}/AgeGroup" }
        description:
          type: string
          description: "Free-form bio or notes about the person."
        interests:
          $ref: "${x-sup.types}/StringArray"
      required: [id, name, email, age_group]

    Registrant:
      allOf:
        - $ref: '#/components/schemas/Person'
      type: object
      description: "Primary registrant for a registration."
      properties:
        registration_ids:
          type: array
          description: "IDs of registrations owned by this registrant."
          items:
            $ref: "${x-sup.types}/Id"
      x-sup:
        dependencies:
          - from: Registrant.email
            to: Registration.event
            dependency:
              prompt: { prompt: "Proceed to event selection only after registrant email is valid." }

    Event:
      type: object
      description: "Bookable event with schedule and pricing."
      properties:
        id:          { $ref: "${x-sup.types}/Id" }
        name:        { $ref: "${x-sup.types}/ShortString120" }
        description: { $ref: "${x-sup.types}/MarkdownString" }
        schedule:    { $ref: "${x-sup.types}/DateTimeArray" }
        capacity:
          type: integer
          minimum: 1
          maximum: 500
        remaining:
          type: integer
          minimum: 0
          maximum: 500
        pricing:
          $ref: '#/components/schemas/Pricing'
      required: [id, name, schedule]

    Registration:
      type: object
      description: "Registration ties registrant, event, and guests (with optional per-guest invitation)."
      properties:
        id:         { $ref: "${x-sup.types}/Id" }
        registrant: { $ref: '#/components/schemas/Registrant' }
        event:      { $ref: '#/components/schemas/Event' }

        guests:
          type: array
          description: "Guests accompanying the registrant; may include invitation fields."
          items:
            allOf:
              - $ref: '#/components/schemas/Person'
              - $ref: '#/components/schemas/Invitation'
          minItems: 0
          maxItems: 49
          x-sup:
            field-dependencies:
              - from: Registration.event
                dependency:
                  prompt: { prompt: "Add/edit guests only after selecting a valid event." }
              - from: Registrant.id
                dependency:
                  prompt: { prompt: "Guests require an identified registrant." }

        status:
          type: string
          enum: [draft, confirmed, cancelled]
      required: [id, registrant, event]
      x-sup:
        dependencies:
          - from: Registrant.id
            to: Registration.event
            dependency:
              prompt: { prompt: "Select an event only after registrant is provided." }
          - from: Registrant.id
            to: Registration.guests
            dependency:
              prompt: { prompt: "Guests require an identified registrant." }
          - from: Registration.event
            to: Registration.guests
            dependency:
              prompt: { prompt: "Guest list becomes available after selecting an event." }