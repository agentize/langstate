[project]
name = "langstate"
version = "0.0.1"
description = "A Python library for managing state in language-based applications with graph data structures"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ "name" = "Agentize AI Inc.", "email" = "contact@agentize.ai" }]
keywords = [
    "langstate",
    "state-management",
    "ai",
    "llm",
    "agents",
    "agentic",
    "openapi",
    "graph",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
homepage = "https://github.com/agentize/langstate"
repository = "https://github.com/agentize/langstate"
documentation = "https://python-poetry.org/docs/"

[tool.poetry]
packages = [{ include = "core" }]

[tool.poetry.dependencies]
python = ">=3.10"
pydantic = "^2.12.5"
openapi3-parser = "^1.1.22"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-asyncio = "^1.3.0"
pytest-cov = "^7.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py", "*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["core"]
branch = true
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
show_missing = true
fail_under = 90
