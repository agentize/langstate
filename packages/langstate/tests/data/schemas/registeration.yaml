openapi: 3.1.0
info:
  title: Event Registration Schema
  version: 1.1.7

x-sup:
  version: 1
  root_entity: Registration

components:
  schemas:
    # -----------------------------------------------------------------------
    # Reusable scalar & utility types
    # -----------------------------------------------------------------------
    Id:
      type: string
      pattern: "^[A-Za-z0-9_-]{4,64}$"
      description: "Globally unique identifier for any entity."

    NameString:
      type: string
      maxLength: 100
      description: "Human-readable name."

    Email:
      type: string
      format: email
      description: "Valid email address."

    Price:
      type: number
      minimum: 0
      maximum: 10000
      description: "Per-person or unit price."

    ShortString120:
      type: string
      maxLength: 120
      description: "Short string up to 120 characters."

    MarkdownString:
      type: string
      description: "Text field supporting Markdown syntax."

    DateTime:
      type: string
      format: date-time
      description: "ISO 8601 date-time string."

    # -----------------------------------------------------------------------
    # Domain models
    # -----------------------------------------------------------------------

    Invitation:
      type: object
      description: "Email content and optional scheduled send time."
      properties:
        subject: { $ref: "#/components/schemas/ShortString120" }
        body: { $ref: "#/components/schemas/MarkdownString" }
        send_at: { $ref: "#/components/schemas/DateTime" }

    Person:
      type: object
      description: "Base participant profile."
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { $ref: "#/components/schemas/NameString" }
        email: { $ref: "#/components/schemas/Email" }

    Guest:
      allOf:
        - $ref: "#/components/schemas/Person"
        - type: object
          properties:
            invitation: { $ref: "#/components/schemas/Invitation" }
          description: "Optional invitation payload; if present, Invitation's required fields apply."

    Event:
      type: object
      description: "Bookable event with schedule and pricing."
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { $ref: "#/components/schemas/ShortString120" }
        description: { $ref: "#/components/schemas/MarkdownString" }
        schedule: { $ref: "#/components/schemas/DateTime" }
        capacity:
          type: integer
          minimum: 1
          maximum: 500
        remaining:
          type: integer
          minimum: 0
          maximum: 500
        pricing: { $ref: "#/components/schemas/Price" }

    Registration:
      type: object
      description: "Registration ties registrant, event, and guests."
      properties:
        id: { $ref: "#/components/schemas/Id" }

        registrant:
          $ref: "#/components/schemas/Person"

        event:
          $ref: "#/components/schemas/Event"
          x-sup:
            constraints:
              - requires: ["registrant"]
                status:
                  allowed: ["validated"]

        guests:
          type: array
          description: "Guests accompanying the registrant; each may include an optional invitation."
          minItems: 0
          maxItems: 49
          items:
            allOf:
              - $ref: "#/components/schemas/Guest"
              - type: object
                x-sup:
                  constraints:
                    - requires: ["event"]
                      status:
                        allowed: ["edited"]
                      prompt: "Guests can only be added when the event is confirmed."
                    - requires: ["registrant"]
                      status:
                        allowed: ["validated"]

        total_price: { $ref: "#/components/schemas/Price" }

        status:
          type: string
          enum: [draft, confirmed, cancelled]
